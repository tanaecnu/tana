<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f4c5c">
<title>旅行小站</title>
<style>
:root{--ink:#19383b;--muted:#637d79;--line:#d8e8e3;--teal:#0f4c5c;--paper:#f5faf7;--card:#fff;--shadow:0 12px 30px #244e4514}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#e1f2ec,transparent 35rem),var(--paper);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:920px;margin:auto;padding:16px 14px 50px}header{background:linear-gradient(130deg,#0f4c5c,#287f83);color:white;border-radius:22px;padding:24px;box-shadow:var(--shadow)}h1{margin:5px 0;font-size:clamp(28px,7vw,42px);line-height:1.2;letter-spacing:-.03em}h2,h3,p{margin:6px 0}.subtle{color:var(--muted)}header .subtle{color:#e1efec}.notice{background:#fff3d8;padding:11px 14px;border-radius:10px;color:#6d5528;margin:12px 0}.tabs{display:flex;gap:8px;overflow-x:auto;margin:14px 0;padding:2px}.tabs button{flex:none;white-space:nowrap}.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;margin:12px 0;box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}.grid .card{margin:0}.badge{font-size:13px;font-weight:700;color:#28766e}.timeline{border-left:3px solid #b2d7cc;padding-left:14px}button,.button{font:inherit;border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:#eef6f2;color:var(--teal);cursor:pointer;text-decoration:none}button.active,.button.primary{background:var(--teal);color:white}a{color:#176a66}label{display:block;margin:10px 0}input,select,textarea{font:inherit;max-width:100%}input[type=checkbox]{width:19px;height:19px;accent-color:#287f83;vertical-align:middle}input[type=text],input[type=time],input[type=number],textarea,select{border:1px solid #cddfd8;border-radius:8px;padding:8px;background:white;color:var(--ink)}textarea{width:100%;resize:vertical}.inline{display:flex;gap:8px;flex-wrap:wrap}.inline label{flex:1;min-width:150px}.inline input{width:100%}.rule{border-top:1px solid var(--line);padding-top:10px}footer{color:var(--muted);font-size:13px}[hidden]{display:none!important}@media print{nav,button{display:none!important}[hidden]{display:block!important}.panel,.card{box-shadow:none;break-inside:avoid}body{background:white}}
</style>
</head>
<body><main>
<header><small>TRAVEL JOURNAL</small><h1 id="title"></h1><p id="subtitle" class="subtle"></p><small id="storage-status">记录保存在当前浏览器</small></header>
<p id="notice" class="notice"></p>
<nav class="tabs" aria-label="小站导航"><button data-view="home">首页</button><button data-view="itinerary">每日行程</button><button data-view="packing">行李清单</button><button data-view="food">美食</button><button data-view="review">旅行复盘</button></nav>
<section id="home" class="view"><div class="panel"><h2>旅行概览</h2><p id="overview"></p></div><div class="grid"><article class="card"><h3>每日行程</h3><p class="subtle">路线、预约和备选安排</p><button data-go="itinerary">查看行程 →</button></article><article class="card"><h3>行李清单</h3><p class="subtle">按类别整理，记录完成进度</p><button data-go="packing">整理行李 →</button></article><article class="card"><h3>美食与复盘</h3><p class="subtle">选择用餐时间，记录旅途感受</p><button data-go="food">查看美食 →</button></article></div></section>
<section id="itinerary" class="view" hidden><div class="panel"><h2>每日行程</h2><nav id="days" class="tabs" aria-label="选择日期"></nav><div id="day-content"></div></div></section>
<section id="packing" class="view" hidden><div class="panel"><h2>行李清单</h2><p id="weather" class="notice"></p><label>天气复查备注 <input type="text" data-key="weather-note" placeholder="填写复查时间或穿搭提醒"></label><p id="packing-progress" class="subtle"></p><div id="packing-list"></div></div></section>
<section id="food" class="view" hidden><div class="panel"><h2>美食推荐</h2><div id="food-list"></div></div></section>
<section id="review" class="view" hidden><div class="panel"><h2>旅行复盘</h2><label>选择日期 <select id="review-day"></select></label><label>满意度 <select id="rating"><option value="">暂不评分</option><option value="1">1 分</option><option value="2">2 分</option><option value="3">3 分</option><option value="4">4 分</option><option value="5">5 分</option></select></label><label>最值得保留什么？ <textarea id="keep" rows="3"></textarea></label><label>下一次如何调整？ <textarea id="change" rows="3"></textarea></label><div id="actual-summary" class="subtle"></div></div></section>
<footer>网页可离线打开。跨设备同步需要另行配置和验证。</footer>
</main><script src="trip-data.js"></script><script src="app.js"></script></body></html>
